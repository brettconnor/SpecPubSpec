name: Governance Check

on:
  push: {}
  pull_request: {}

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SpecPubSpec conformance (dogfood docs/seed-doc.md's full normative requirement set)
        run: bash scripts/validate-structure.sh

      - name: Audit repository for unaccounted-for files and directories (REQ-044)
        run: bash scripts/audit-repo.sh
