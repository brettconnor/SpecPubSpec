name: Governance Check

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'docs/seed-doc.md'
      - 'scripts/sync-readme.sh'
      - '.github/workflows/governance-check.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'docs/seed-doc.md'
      - 'scripts/sync-readme.sh'
      - '.github/workflows/governance-check.yml'

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SpecPubSpec conformance (dogfood REQ-001 through REQ-031)
        run: bash site/scripts/validate-structure.sh

      - name: Validate repo-specific governance artifacts (outside SpecPubSpec scope)
        run: |
          fail=0
          for artifact in \
            .github/CODEOWNERS \
            .github/workflows/governance-check.yml; do
            if [ ! -e "$artifact" ]; then
              echo "FAIL: missing required artifact: $artifact" >&2
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
