name: Governance Check

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'docs/seed-doc.md'
      - 'scripts/sync-readme.sh'
      - '.github/CODEOWNERS'
      - '.github/workflows/governance-check.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'docs/seed-doc.md'
      - 'scripts/sync-readme.sh'
      - '.github/CODEOWNERS'
      - '.github/workflows/governance-check.yml'

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SpecPubSpec conformance (dogfood docs/seed-doc.md's full normative requirement set)
        run: bash scripts/validate-structure.sh
