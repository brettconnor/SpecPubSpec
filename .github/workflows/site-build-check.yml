name: Site build check

# T020: PR-only build+link check, no deploy. Gives contributors a preview
# signal on any change touching the canonical docs or the site itself
# (spec.md User Story 3, FR-006, SC-004).
on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/validate-structure.sh'

# Least-privilege GITHUB_TOKEN: this workflow only builds the site and checks
# links against the checked-out tree; it never writes to the repo or deploys.
# Without this block, the token defaults to a broader permission set, which
# matters more on a public repo where pull_request runs can be triggered by
# outside contributors (forks).
permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build (includes validate-content gate)
        working-directory: site
        run: npm run build

      # T021: fail the check on any broken internal cross-reference between
      # rendered pages (spec.md Edge Cases).
      - name: Check internal links
        working-directory: site
        run: node scripts/check-links.mjs
